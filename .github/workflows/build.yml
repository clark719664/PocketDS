name: build

on:
  push:
    branches: [pocketds-main]
  workflow_dispatch: {}

env:
  ANDROID_PLATFORM_VERSION: android-36
  ANDROID_BUILD_TOOLS_VERSION: 36.0.0
  ANDROID_NDK_VERSION: 28.2.13676358
  ANDROID_CMAKE_VERSION: 3.31.6

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned platform, build-tools, NDK, CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager \
            "platforms;${ANDROID_PLATFORM_VERSION}" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"

      # src/video_core/host_shaders/CMakeLists.txt find_program()s a host
      # `glslangValidator` at configure time (FATAL_ERROR if missing). It is
      # not present on a clean Ubuntu runner by default.
      - name: Install glslang (host shader compiler)
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools
          if ! command -v glslangValidator >/dev/null 2>&1; then
            GLSLANG_BIN="$(command -v glslang || true)"
            if [ -n "$GLSLANG_BIN" ]; then
              sudo ln -s "$GLSLANG_BIN" /usr/local/bin/glslangValidator
            else
              echo "::error::glslangValidator not found after installing glslang-tools"
              exit 1
            fi
          fi
          glslangValidator --version || true

      - name: Install ccache
        run: sudo apt-get install -y ccache

      - name: Cache ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: pocketds-android-ccache
          max-size: 2G

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        working-directory: src/android
        run: chmod +x ./gradlew

      - name: Build assembleMainlineDebug
        working-directory: src/android
        run: ./gradlew assembleMainlineDebug --no-daemon -PYUZU_ANDROID_ARGS="-DUSE_CCACHE=true"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pocketds-debug
          path: src/android/app/build/outputs/apk/mainline/debug/*.apk
          if-no-files-found: error
